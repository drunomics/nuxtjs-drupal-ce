name: ci

on:
  pull_request:
    branches:
      - 2.x
  push:
    branches:
      - 2.x

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # Renovate and dependabot regenerate package-lock.json with npm 11;
      # the npm 10 bundled with Node 22 rejects those lockfiles as out of
      # sync, so `npm ci` needs npm 11 too.
      - run: npm install -g npm@^11
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run dev:prepare
      - run: npm run test
      - name: Run prerender test
        run: ./scripts/test-prerender.sh
