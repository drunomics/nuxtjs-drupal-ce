<!-- Load Nuxt

<script type="module" src="http://localhost:3000/_nuxt/home/fago/projects/xb-dev/nuxtjs-drupal-ce/node_modules/nuxt/dist/app/entry.js"></script>

<!-- Test script -->
<script>
  window.addEventListener('nuxt-drupal-ce:ready', (event) => {
    const { nuxtApp } = event.detail

    console.log('running test script')

    nuxtApp.$drupalCePreviewComponent(
      'drupal-markup',
      {
        content: `
            <div class="custom-markup">
              <h2>Rendered HTML Content</h2>
              <p>This is <strong>HTML</strong> content rendered through the Nuxt component.</p>
            </div>
          `
      },
      '#preview-target'
    )

    nuxtApp.$drupalCePreviewComponent(
      'node-article-full',
      {
        title: 'Test article',
      },
      '#preview-target-2'
    )

    nuxtApp.$drupalCePreviewComponent(
      'node-article-full',
      {
        title: 'Test article 2',
      },
      '#preview-target-3'
    )

  })


</script>

</html>
